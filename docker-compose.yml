name: myleetgpu

x-backend: &backend
  build:
    context: .
    dockerfile: infra/backend.Dockerfile
  image: myleetgpu/backend:local
  restart: unless-stopped
  user: "${MYLEETGPU_HOST_UID:-1000}:${MYLEETGPU_HOST_GID:-1000}"
  environment:
    HOME: /tmp
    MYLEETGPU_DATA_DIR: /data
    MYLEETGPU_PROBLEMS_DIR: /app/problems
    MYLEETGPU_HOST_DATA_DIR: ${MYLEETGPU_HOST_DATA_DIR:?run through make start}
    MYLEETGPU_CUDA_IMAGE: ${CUDA_IMAGE:-nvidia/cuda:12.4.1-devel-ubuntu22.04}
    MYLEETGPU_TRITON_IMAGE: ${TRITON_IMAGE:-pytorch/pytorch:2.5.1-cuda12.4-cudnn9-devel@sha256:14611869895df612b7b07227d5925f30ec3cd6673bad58ce3d84ed107950e014}
    MYLEETGPU_CUDA_ARCH: ${MYLEETGPU_CUDA_ARCH:-auto}
    MYLEETGPU_LOG_LEVEL: ${MYLEETGPU_LOG_LEVEL:-INFO}
    MYLEETGPU_OUTPUT_LIMIT_BYTES: ${MYLEETGPU_OUTPUT_LIMIT_BYTES:-65536}
    MYLEETGPU_CONTAINER_MEMORY: ${MYLEETGPU_CONTAINER_MEMORY:-2g}
    MYLEETGPU_CONTAINER_CPUS: ${MYLEETGPU_CONTAINER_CPUS:-2}
    # Only reachable on the private Compose network; no API port is published to the host.
    MYLEETGPU_API_HOST: 0.0.0.0
  volumes:
    - ./data:/data
    - ./problems:/app/problems:ro
  networks:
    - internal

services:
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    command: ["python", "-m", "myleetgpu.api.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    expose:
      - "8000"

  worker:
    <<: *backend
    command: ["python", "-m", "myleetgpu.worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Docker socket access makes this trusted platform component privileged.
    # Submitted code still runs in separate non-root containers without the socket.
    group_add:
      - "${MYLEETGPU_DOCKER_GID:-1000}"
    volumes:
      - ./data:/data
      - ./problems:/app/problems:ro
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    image: myleetgpu/web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    networks:
      - internal

networks:
  internal:
    driver: bridge
