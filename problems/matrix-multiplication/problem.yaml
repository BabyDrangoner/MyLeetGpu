schema_version: 2
slug: matrix-multiplication
title: 行主序矩阵乘法
difficulty: medium
revision: 1
default_language: cuda_cpp

implementations:
  cuda_cpp:
    language: cuda_cpp
    starter: starter.cu
    statement_appendix: instructions/cuda_cpp.md
    signature:
      header: include/solve.h
      symbol: solve
      declaration: "void solve(const float* a, const float* b, float* c, int m, int k, int n, cudaStream_t stream)"
    harness:
      validator: harness/validator.cu
      benchmark: harness/benchmark.cu
    compiler:
      executable: nvcc
      standard: c++17
      optimization: O3
      architecture: detected
      allowed_flags:
        - --std=c++17
        - -O3
      include_paths:
        - include
  triton_python:
    language: triton_python
    starter: triton/starter.py
    statement_appendix: instructions/triton_python.md
    signature:
      symbol: solve
      declaration: "def solve(a: torch.Tensor, b: torch.Tensor, c: torch.Tensor, m: int, k: int, n: int) -> None"
    harness:
      validator: triton/harness/validator.py
      benchmark: triton/harness/benchmark.py
    runtime:
      profile: triton_torch_cuda_v1
      executable: python3
      syntax_check: py_compile

types:
  inputs:
    - name: a
      type: float32
      shape: [m, k]
      layout: row_major
      memory: device
      access: read_only
    - name: b
      type: float32
      shape: [k, n]
      layout: row_major
      memory: device
      access: read_only
    - name: m
      type: int32
      memory: host_value
    - name: k
      type: int32
      memory: host_value
    - name: n
      type: int32
      memory: host_value
  outputs:
    - name: c
      type: float32
      shape: [m, n]
      layout: row_major
      memory: device
      access: write_only

constraints:
  m:
    min: 1
    max: 4096
  k:
    min: 1
    max: 4096
  n:
    min: 1
    max: 4096
  matrix_elements:
    a_max: 16777216
    b_max: 16777216
    c_max: 16777216
  values:
    finite: true
    min: -1.0
    max: 1.0
  aliasing: none

tolerance:
  mode: float
  atol: 0.03
  rtol: 0.005
  nan_equal: false
  infinity: same_sign

public:
  seed: 4242
  timeout_ms: 15000
  cases:
    - name: sample_1
      m: 2
      k: 3
      n: 2
      pattern: sequence
    - name: sample_2
      m: 3
      k: 5
      n: 4
      pattern: sequence

internal:
  seeds: [271828, 314159]
  timeout_ms: 45000
  cases:
    - m: 17
      k: 19
      n: 23
      pattern: random
    - m: 1
      k: 257
      n: 37
      pattern: random
    - m: 73
      k: 31
      n: 1
      pattern: random
    - m: 64
      k: 513
      n: 96
      pattern: random
    - m: 193
      k: 127
      n: 257
      pattern: random
    - m: 3
      k: 4096
      n: 5
      pattern: random
    - m: 4096
      k: 7
      n: 3
      pattern: random
    - m: 5
      k: 9
      n: 4096
      pattern: random

benchmark:
  protocol_version: "1"
  suite_seed: 987654
  sizes:
    - label: 128x128x128
      m: 128
      k: 128
      n: 128
      elements: 49152
      inner_repetitions: 1
    - label: 256x256x256
      m: 256
