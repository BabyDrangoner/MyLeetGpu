    - label: 512x512x512
      m: 512
      k: 512
      n: 512
      elements: 786432
      inner_repetitions: 1
  warmup: 4
  iterations: 15
  timeout_ms: 90000

timeouts:
  compile_ms: 30000
  public_ms: 15000
  validation_ms: 45000
  benchmark_ms: 90000
