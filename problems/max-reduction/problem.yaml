schema_version: 2
slug: max-reduction
title: 单精度向量最大值归约
difficulty: medium
revision: 1
default_language: cuda_cpp

implementations:
  cuda_cpp:
    language: cuda_cpp
    starter: starter.cu
    statement_appendix: instructions/cuda_cpp.md
    signature:
      header: include/solve.h
      symbol: solve
      declaration: "void solve(const float* input, float* output, int n, cudaStream_t stream)"
    harness:
      validator: harness/validator.cu
      benchmark: harness/benchmark.cu
    compiler:
      executable: nvcc
      standard: c++17
      optimization: O3
      architecture: detected
      allowed_flags:
        - --std=c++17
        - -O3
      include_paths:
        - include
  triton_python:
    language: triton_python
    starter: triton/starter.py
    statement_appendix: instructions/triton_python.md
    signature:
      symbol: solve
      declaration: "def solve(input: torch.Tensor, output: torch.Tensor, n: int) -> None"
    harness:
      validator: triton/harness/validator.py
      benchmark: triton/harness/benchmark.py
    runtime:
      profile: triton_torch_cuda_v1
      executable: python3
      syntax_check: py_compile

types:
  inputs:
    - name: input
      type: float32
      shape: [n]
      memory: device
      access: read_only
    - name: n
      type: int32
      memory: host_value
  outputs:
    - name: output
      type: float32
      shape: [1]
      memory: device
      access: write_only

constraints:
  n:
    min: 1
    max: 16777216
  values:
    finite: true
    min: -3.4028234663852886e+38
    max: 3.4028234663852886e+38
  aliasing: none

tolerance:
  mode: float
  atol: 0.0
  rtol: 0.0
  nan_equal: false
  infinity: same_sign

public:
  seed: 91453
  timeout_ms: 5000
  cases:
    - name: sample_1
      n: 1
      pattern: extreme_low
    - name: sample_2
      n: 1000
      pattern: all_negative

internal:
  seeds: [161803, 141421]
  timeout_ms: 15000
  cases:
    - n: 31
      pattern: extremes
    - n: 4097
      pattern: all_negative
    - n: 65537
      pattern: alternating
    - n: 513
      pattern: signed_zero
    - n: 1048576
      pattern: signed_random

benchmark:
  protocol_version: "1"
  suite_seed: 20240519
  sizes:
    - label: 64K
      n: 65536
      inner_repetitions: 64
    - label: 1M
      n: 1048576
      inner_repetitions: 16
    - label: 16M
      n: 16777216
      inner_repetitions: 4
  warmup: 8
  iterations: 20
  timeout_ms: 90000

timeouts:
  compile_ms: 30000
  public_ms: 5000
  validation_ms: 15000
  benchmark_ms: 90000
