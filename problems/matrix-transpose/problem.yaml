schema_version: 2
slug: matrix-transpose
title: 行主序矩阵转置
difficulty: medium
revision: 1
default_language: cuda_cpp

implementations:
  cuda_cpp:
    language: cuda_cpp
    starter: starter.cu
    statement_appendix: instructions/cuda_cpp.md
    signature:
      header: include/solve.h
      symbol: solve
      declaration: "void solve(const float* input, float* output, int rows, int cols, cudaStream_t stream)"
    harness:
      validator: harness/validator.cu
      benchmark: harness/benchmark.cu
    compiler:
      executable: nvcc
      standard: c++17
      optimization: O3
      architecture: detected
      allowed_flags:
        - --std=c++17
        - -O3
      include_paths:
        - include
  triton_python:
    language: triton_python
    starter: triton/starter.py
    statement_appendix: instructions/triton_python.md
    signature:
      symbol: solve
      declaration: "def solve(input: torch.Tensor, output: torch.Tensor, rows: int, cols: int) -> None"
    harness:
      validator: triton/harness/validator.py
      benchmark: triton/harness/benchmark.py
    runtime:
      profile: triton_torch_cuda_v1
      executable: python3
      syntax_check: py_compile

types:
  inputs:
    - name: input
      type: float32
      shape: [rows, cols]
      layout: row_major
      memory: device
      access: read_only
    - name: rows
      type: int32
      memory: host_value
    - name: cols
      type: int32
      memory: host_value
  outputs:
    - name: output
      type: float32
      shape: [cols, rows]
      layout: row_major
      memory: device
      access: write_only

constraints:
  rows:
    min: 1
    max: 8192
  cols:
    min: 1
    max: 8192
  elements:
    max: 16777216
  values:
    finite: true
    min: -50.0
    max: 50.0
  aliasing: none

tolerance:
  mode: float
  atol: 0.0
  rtol: 0.0
  nan_equal: false
  infinity: same_sign

public:
  seed: 2718
  timeout_ms: 5000
  cases:
    - name: sample_1
      rows: 1
      cols: 1
      pattern: sequence
    - name: sample_2
      rows: 3
      cols: 5
      pattern: sequence

internal:
  seeds: [314159, 1618033]
  timeout_ms: 12000
  cases:
    - rows: 17
      cols: 33
      pattern: random
    - rows: 513
      cols: 1024
      pattern: random
    - rows: 1024
      cols: 513
      pattern: random
    - rows: 2048
      cols: 2048
      pattern: random

benchmark:
  protocol_version: "1"
  suite_seed: 987654
  sizes:
    - label: 256x256
      rows: 256
      cols: 256
      elements: 65536
      inner_repetitions: 64
    - label: 1024x1024
      rows: 1024
      cols: 1024
      elements: 1048576
      inner_repetitions: 16
    - label: 4096x4096
      rows: 4096
      cols: 4096
      elements: 16777216
      inner_repetitions: 4
  warmup: 8
  iterations: 20
  timeout_ms: 60000

timeouts:
  compile_ms: 30000
  public_ms: 5000
  validation_ms: 12000
  benchmark_ms: 60000
