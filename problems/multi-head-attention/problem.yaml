schema_version: 2
slug: multi-head-attention
title: 多头缩放点积注意力
difficulty: medium
revision: 1
default_language: torch_python

implementations:
  torch_python:
    language: torch_python
    starter: torch/starter.py
    statement_appendix: instructions/torch_python.md
    signature:
      symbol: solve
      declaration: "def solve(query: torch.Tensor, key: torch.Tensor, value: torch.Tensor, attention_mask: torch.Tensor) -> torch.Tensor"
    harness:
      validator: torch/harness/validator.py
      benchmark: torch/harness/benchmark.py
    runtime:
      profile: torch_cuda_v1
      executable: python3
      syntax_check: py_compile

types:
  inputs:
    - name: query
      type: float32
      shape: [batch, heads, query_length, head_dim]
      layout: contiguous
      memory: device
      access: read_only
    - name: key
      type: float32
      shape: [batch, heads, key_length, head_dim]
      layout: contiguous
      memory: device
      access: read_only
    - name: value
      type: float32
      shape: [batch, heads, key_length, head_dim]
      layout: contiguous
      memory: device
      access: read_only
    - name: attention_mask
      type: bool
      shape: [batch, 1, query_length, key_length]
      layout: contiguous
      memory: device
      access: read_only
  outputs:
    - name: output
      type: float32
      shape: [batch, heads, query_length, head_dim]
      memory: device
      access: return_value

constraints:
  batch:
    min: 1
    max: 4
  heads:
    min: 1
    max: 32
  query_length:
    min: 1
    max: 1024
  key_length:
    min: 1
    max: 1024
  head_dim:
    min: 1
    max: 128
  values:
    finite: true
  attention_mask:
    true_means: participates_in_attention
    at_least_one_true_per_query: true
  scaling: inverse_sqrt_head_dim
  dropout: 0.0
  aliasing: output_must_not_alias_inputs
  input_mutation: forbidden

tolerance:
  mode: float
  atol: 0.0002
  rtol: 0.0002
  nan_equal: false
  infinity: same_sign

public:
  seed: 230901
  timeout_ms: 15000
  cases:
    - name: sample_handcrafted
      batch: 1
      heads: 2
      query_length: 2
      key_length: 3
      head_dim: 4
      pattern: sequence
      mask_pattern: all
    - name: sample_padding_mask
      batch: 2
      heads: 4
      query_length: 5
      key_length: 7
      head_dim: 8
      pattern: random
      mask_pattern: prefix
    - name: sample_causal_mask
      batch: 1
      heads: 3
      query_length: 9
      key_length: 9
      head_dim: 16
      pattern: random
      mask_pattern: causal

