schema_version: 2
slug: multi-head-attention
title: 多头自注意力
difficulty: medium
revision: 2
default_language: torch_python

implementations:
  torch_python:
    language: torch_python
    starter: torch/starter.py
    statement_appendix: instructions/torch_python.md
    signature:
      symbol: MultiHeadAttention
      declaration: |-
        class MultiHeadAttention:
            def __init__(self, numHeads: int, qWeight: torch.Tensor, kWeight: torch.Tensor, vWeight: torch.Tensor, outputWeight: torch.Tensor): ...
            def forward(self, X: torch.Tensor, isCasual: bool) -> torch.Tensor: ...
    harness:
      validator: torch/harness/validator.py
      benchmark: torch/harness/benchmark.py
    runtime:
      profile: torch_cuda_v1
      executable: python3
      syntax_check: py_compile

types:
  inputs:
    - name: X
      type: float32
      shape: [batch, sequence_length, embed_dim]
      layout: contiguous
      memory: device
      access: read_only
    - name: isCasual
      type: bool
      shape: []
      memory: host
      access: read_only
  constructor_state:
    - name: numHeads
      type: integer
      access: read_only
    - name: qWeight
      type: float32
      shape: [embed_dim, embed_dim]
      layout: contiguous
      memory: device
      access: read_only
    - name: kWeight
      type: float32
      shape: [embed_dim, embed_dim]
      layout: contiguous
      memory: device
      access: read_only
    - name: vWeight
      type: float32
      shape: [embed_dim, embed_dim]
      layout: contiguous
      memory: device
      access: read_only
    - name: outputWeight
      type: float32
      shape: [embed_dim, embed_dim]
      layout: contiguous
      memory: device
      access: read_only
  outputs:
    - name: output
      type: float32
      shape: [batch, sequence_length, embed_dim]
      memory: device
      access: return_value

constraints:
  batch:
    min: 1
    max: 4
  sequence_length:
    min: 1
    max: 1024
  embed_dim:
    min: 1
    max: 1024
  num_heads:
    min: 1
    max: 32
  head_relationship:
    embed_dim_divisible_by_num_heads: true
    head_dim: embed_dim_divided_by_num_heads
  values:
    finite: true
  projection:
    convention: right_multiply
    formulas:
      - Q = X @ qWeight
      - K = X @ kWeight
      - V = X @ vWeight
      - output = concatenated_heads @ outputWeight
  attention:
    kind: self_attention
    causal_true_means: lower_triangle_including_diagonal
    scaling: inverse_sqrt_head_dim
    softmax_dimension: key_sequence
  bias: false
  dropout: 0.0
  aliasing: output_must_not_alias_inputs_or_state
  input_mutation: forbidden
  state_mutation: forbidden

tolerance:
  mode: float
  atol: 0.0004
  rtol: 0.0004
  nan_equal: false
  infinity: same_sign

public:
  seed: 230901
  timeout_ms: 15000
  cases:
    - name: sample_noncausal
      batch: 1
      sequence_length: 3
      embed_dim: 8
      num_heads: 2
      is_casual: false
      pattern: sequence
    - name: sample_causal
      batch: 2
      sequence_length: 7
      embed_dim: 32
      num_heads: 4
      is_casual: true
      pattern: random
    - name: sample_odd_head_dim
      batch: 1
      sequence_length: 5
      embed_dim: 21
      num_heads: 3
      is_casual: false
      pattern: head_markers

internal:
  seeds: [314159, 271828, 1618033]
  timeout_ms: 60000
  cases:
    - name: internal_case_1
      category: boundary
      batch: 1
      sequence_length: 1
      embed_dim: 1
      num_heads: 1
      is_casual: true
      pattern: constant
    - name: internal_case_2
      category: boundary
      batch: 2
      sequence_length: 1
      embed_dim: 12
      num_heads: 3
      is_casual: false
      pattern: random
    - name: internal_case_3
      category: boundary
      batch: 1
      sequence_length: 9
      embed_dim: 20
      num_heads: 5
      is_casual: true
      pattern: random
    - name: internal_case_4
      category: boundary
      batch: 1
      sequence_length: 33
      embed_dim: 168
      num_heads: 7
      is_casual: true
      pattern: random
    - name: internal_case_5
      category: invariant
      batch: 2
      sequence_length: 6
      embed_dim: 48
      num_heads: 6
      is_casual: false
      pattern: projection_markers
    - name: internal_case_6
      category: numerical
      batch: 1
      sequence_length: 17
      embed_dim: 256
      num_heads: 4
      is_casual: true
      pattern: extreme_logits
    - name: internal_case_7
      category: random
      batch: 2
      sequence_length: 65
      embed_dim: 256
      num_heads: 8
      is_casual: false
      pattern: random

benchmark:
  protocol_version: "2"
  suite_seed: 20260902
  sizes:
    - label: B1-H8-S128-E512
      batch: 1
      sequence_length: 128
      embed_dim: 512
      num_heads: 8
      is_casual: false
      inner_repetitions: 4
    - label: B2-H12-S384-E768
      batch: 2
      sequence_length: 384
      embed_dim: 768
      num_heads: 12
      is_casual: true
      inner_repetitions: 1
    - label: B1-H16-S1024-E1024
      batch: 1
      sequence_length: 1024
      embed_dim: 1024
      num_heads: 16
      is_casual: true
      inner_repetitions: 1
  warmup: 5
  iterations: 20
  timeout_ms: 120000

timeouts:
  compile_ms: 30000
  public_ms: 15000
  validation_ms: 60000
  benchmark_ms: 120000
