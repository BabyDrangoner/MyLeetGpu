schema_version: 2
slug: grouped-query-attention
title: 分组查询自注意力
difficulty: hard
revision: 2
default_language: torch_python

implementations:
  torch_python:
    language: torch_python
    starter: torch/starter.py
    statement_appendix: instructions/torch_python.md
    signature:
      symbol: GroupedQueryAttention
      declaration: |-
        class GroupedQueryAttention:
            def __init__(self, numQueryHeads: int, numKeyValueHeads: int, qWeight: torch.Tensor, kWeight: torch.Tensor, vWeight: torch.Tensor, outputWeight: torch.Tensor): ...
            def forward(self, X: torch.Tensor, isCasual: bool) -> torch.Tensor: ...
    harness:
      validator: torch/harness/validator.py
      benchmark: torch/harness/benchmark.py
    runtime:
      profile: torch_cuda_v1
      executable: python3
      syntax_check: py_compile

types:
  constructor_state:
    - name: numQueryHeads
      type: int
      access: read_only
    - name: numKeyValueHeads
      type: int
      access: read_only
    - name: qWeight
      type: float32
      shape: [embedding_dim, embedding_dim]
      layout: contiguous
      memory: device
      access: read_only
    - name: kWeight
      type: float32
      shape: [embedding_dim, key_value_dim]
      layout: contiguous
      memory: device
      access: read_only
    - name: vWeight
      type: float32
      shape: [embedding_dim, key_value_dim]
      layout: contiguous
      memory: device
      access: read_only
    - name: outputWeight
      type: float32
      shape: [embedding_dim, embedding_dim]
      layout: contiguous
      memory: device
      access: read_only
  inputs:
    - name: X
      type: float32
      shape: [batch, sequence_length, embedding_dim]
      layout: contiguous
      memory: device
      access: read_only
    - name: isCasual
      type: bool
      shape: []
      memory: host
      access: read_only
  outputs:
    - name: output
      type: float32
      shape: [batch, sequence_length, embedding_dim]
      memory: device
      access: return_value

constraints:
  batch:
    min: 1
    max: 4
  sequence_length:
    min: 1
    max: 1024
  embedding_dim:
    min: 1
    max: 4096
  query_heads:
    min: 1
    max: 32
  key_value_heads:
    min: 1
    max: 16
  head_dim:
    min: 1
    max: 128
    relation: embedding_dim_divided_by_query_heads
  key_value_dim:
    relation: key_value_heads_times_head_dim
  head_relationship:
    embedding_dim_divisible_by_query_heads: true
    query_heads_divisible_by_key_value_heads: true
    mapping: contiguous_query_head_groups
  projections:
    source: same_X
    weight_application: right_multiply
    bias: false
    output_projection: true
  values:
    finite: true
  isCasual:
    type: python_bool
    true_means: inclusive_lower_triangular_mask
  scaling: inverse_sqrt_head_dim
  dropout: 0.0
  aliasing: output_must_not_alias_inputs_or_constructor_state
  input_mutation: forbidden
  constructor_state_mutation: forbidden

tolerance:
  mode: float
  atol: 0.0003
  rtol: 0.0003
  nan_equal: false
  infinity: same_sign

public:
  seed: 470311
  timeout_ms: 15000
  cases:
    - name: sample_group_mapping
      batch: 1
      sequence_length: 4
      embedding_dim: 8
      query_heads: 4
      key_value_heads: 2
      is_causal: false
      pattern: group_markers
    - name: sample_causal
      batch: 2
      sequence_length: 7
      embedding_dim: 16
      query_heads: 8
      key_value_heads: 2
      is_causal: true
      pattern: random
    - name: sample_mqa
      batch: 1
      sequence_length: 9
      embedding_dim: 12
      query_heads: 6
      key_value_heads: 1
      is_causal: true
      pattern: random

