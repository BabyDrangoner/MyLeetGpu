schema_version: 1
slug: reduction
title: 单精度向量求和归约
difficulty: medium
revision: 1
language: cuda_cpp

signature:
  header: include/solve.h
  symbol: solve
  declaration: "void solve(const float* input, float* output, int n, cudaStream_t stream)"

types:
  inputs:
    - name: input
      type: float32
      shape: [n]
      memory: device
      access: read_only
    - name: n
      type: int32
      memory: host_value
    - name: stream
      type: cuda_stream
      memory: host_value
  outputs:
    - name: output
      type: float32
      shape: [1]
      memory: device
      access: write_only

constraints:
  n:
    min: 1
    max: 16777216
  values:
    finite: true
    min: -1.0
    max: 1.0
  aliasing: none

tolerance:
  mode: float
  atol: 0.02
  rtol: 0.00005
  nan_equal: false
  infinity: same_sign

starter: starter.cu
harness:
  validator: harness/validator.cu
  benchmark: harness/benchmark.cu

public:
  seed: 57721
  timeout_ms: 5000
  cases:
    - name: sample_1
      n: 1
      pattern: edge
    - name: sample_2
      n: 1000
      pattern: alternating

internal:
  seeds: [112358, 271828]
  timeout_ms: 15000
  cases:
    - n: 31
      pattern: alternating
    - n: 4097
      pattern: signed_random
    - n: 65537
      pattern: ones
    - n: 1048576
      pattern: signed_random

benchmark:
  protocol_version: "1"
  suite_seed: 20240517
  sizes:
    - label: 64K
      n: 65536
      inner_repetitions: 64
    - label: 1M
      n: 1048576
      inner_repetitions: 16
    - label: 16M
      n: 16777216
      inner_repetitions: 4
  warmup: 8
  iterations: 20
  timeout_ms: 90000

timeouts:
  compile_ms: 30000
  public_ms: 5000
  validation_ms: 15000
  benchmark_ms: 90000

compiler:
  executable: nvcc
  standard: c++17
  optimization: O3
  architecture: detected
  allowed_flags:
    - --std=c++17
    - -O3
  include_paths:
    - include

