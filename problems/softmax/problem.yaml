schema_version: 2
slug: softmax
title: 二维张量逐行 Softmax
difficulty: medium
revision: 1
default_language: cuda_cpp

implementations:
  cuda_cpp:
    language: cuda_cpp
    starter: starter.cu
    statement_appendix: instructions/cuda_cpp.md
    signature:
      header: include/solve.h
      symbol: solve
      declaration: "void solve(const float* input, float* output, int rows, int cols, cudaStream_t stream)"
    harness:
      validator: harness/validator.cu
      benchmark: harness/benchmark.cu
    compiler:
      executable: nvcc
      standard: c++17
      optimization: O3
      architecture: detected
      allowed_flags:
        - --std=c++17
        - -O3
      include_paths:
        - include
  triton_python:
    language: triton_python
    starter: triton/starter.py
    statement_appendix: instructions/triton_python.md
    signature:
      symbol: solve
      declaration: "def solve(input: torch.Tensor, output: torch.Tensor, rows: int, cols: int) -> None"
    harness:
      validator: triton/harness/validator.py
      benchmark: triton/harness/benchmark.py
    runtime:
      profile: triton_torch_cuda_v1
      executable: python3
      syntax_check: py_compile

types:
  inputs:
    - name: input
      type: float32
      shape: [rows, cols]
      layout: row_major
      memory: device
      access: read_only
    - name: rows
      type: int32
      memory: host_value
    - name: cols
      type: int32
      memory: host_value
  outputs:
    - name: output
      type: float32
      shape: [rows, cols]
      layout: row_major
      memory: device
      access: write_only

constraints:
  rows:
    min: 1
    max: 65536
  cols:
    min: 1
    max: 4096
  elements:
    max: 16777216
  values:
    finite: true
    min: -100.0
    max: 100.0
  aliasing: none

tolerance:
  mode: float
  atol: 0.00003
  rtol: 0.0003
  nan_equal: false
  infinity: same_sign

public:
  seed: 4242
  timeout_ms: 5000
  cases:
    - name: sample_1
      rows: 1
      cols: 1
      pattern: singleton
    - name: sample_2
      rows: 3
      cols: 5
      pattern: sequence

internal:
  seeds: [424242, 8675309]
  timeout_ms: 30000
  cases:
    - rows: 7
      cols: 31
      pattern: random
    - rows: 257
      cols: 3
      pattern: extreme
    - rows: 19
      cols: 257
      pattern: repeated
    - rows: 64
      cols: 4096
      pattern: extreme
    - rows: 1024
      cols: 513
      pattern: random
    - rows: 65536
      cols: 1
      pattern: singleton
    - rows: 4096
      cols: 4095
      pattern: random

benchmark:
  protocol_version: "1"
  suite_seed: 20240901
  sizes:
    - label: 8192x128
      rows: 8192
      cols: 128
      elements: 1048576
      inner_repetitions: 16
    - label: 4096x1024
      rows: 4096
      cols: 1024
      elements: 4194304
      inner_repetitions: 8
    - label: 2048x4096
      rows: 2048
      cols: 4096
      elements: 8388608
      inner_repetitions: 4
  warmup: 8
  iterations: 20
  timeout_ms: 90000

timeouts:
  compile_ms: 30000
  public_ms: 5000
  validation_ms: 30000
  benchmark_ms: 90000
