schema_version: 2
slug: online-softmax
title: Online Softmax：流式归一化统计
difficulty: medium
revision: 1
default_language: python

implementations:
  cpp:
    language: cpp
    starter: cpp/starter.cpp
    statement_appendix: instructions/cpp.md
    signature:
      header: cpp/solve.h
      symbol: online_softmax_update
      declaration: "std::pair<double, double> online_softmax_update(double running_max, double running_sum, const std::vector<double>& chunk)"
    harness:
      validator: cpp/harness/validator.cpp
      benchmark: cpp/harness/benchmark.cpp
      support_files: [cpp/harness/online_softmax_common.h]
    compiler:
      executable: c++
      standard: c++17
      optimization: O3
      allowed_flags: [-std=c++17, -O3]
      include_paths: []
  python:
    language: python
    starter: python/starter.py
    statement_appendix: instructions/python.md
    signature:
      symbol: online_softmax_update
      declaration: "def online_softmax_update(running_max: float, running_sum: float, chunk: list[float]) -> tuple[float, float]"
    harness:
      validator: python/harness/validator.py
      benchmark: python/harness/benchmark.py
      support_files: [python/harness/online_softmax_common.py]
    runtime:
      profile: python_cpu_v1
      executable: python3
      syntax_check: py_compile

types:
  inputs:
    - {name: running_max, type: float64, memory: host, access: read_only}
    - {name: running_sum, type: float64, memory: host, access: read_only}
    - {name: chunk, type: float64, shape: [chunk_size], memory: host, access: read_only}
  outputs:
    - {name: new_max, type: float64, memory: host, access: return_value}
    - {name: new_sum, type: float64, memory: host, access: return_value}
constraints:
  elements: {min: 0, max: 131072}
  values: {finite: true, min: -10000.0, max: 10000.0}
  initial_state: {running_max: negative_infinity, running_sum: 0.0}
  empty_chunk: preserve_state
  input_mutation: forbidden
  history: only_the_two_input_statistics_are_available
  complexity: {time: linear_in_chunk_size, extra_space: constant}
tolerance:
  mode: float
  atol: 0.000000001
  rtol: 0.000000001
  nan_equal: false
  infinity: same_sign
public:
  seed: 20260920
  timeout_ms: 5000
  cases:
    - {name: sample_empty, pattern: empty, elements: 0}
    - {name: sample_singleton, pattern: singleton, elements: 1}
    - {name: sample_chunked, pattern: sequence, elements: 5}
internal:
  seeds: [424242, 271828]
  timeout_ms: 15000
  cases:
    - {name: internal_equal, pattern: equal, elements: 257}
    - {name: internal_increasing, pattern: increasing, elements: 257}
    - {name: internal_extremes, pattern: extremes, elements: 511}
    - {name: internal_decreasing, pattern: decreasing, elements: 257}
    - {name: internal_close_maxima, pattern: close_maxima, elements: 1025}
    - {name: internal_carried_state, pattern: carried_state, elements: 97}
    - {name: internal_random_chunks, pattern: random, elements: 4099}
    - {name: internal_long, pattern: random, elements: 131072}
benchmark:
  protocol_version: "1"
  suite_seed: 20260920
  sizes:
    - {label: N1024-C64, elements: 1024, chunk_size: 64, inner_repetitions: 4}
    - {label: N16384-C256, elements: 16384, chunk_size: 256, inner_repetitions: 1}
    - {label: N131072-C1024, elements: 131072, chunk_size: 1024, inner_repetitions: 1}
  warmup: 2
  iterations: 7
  timeout_ms: 30000
timeouts:
  compile_ms: 30000
  public_ms: 5000
  validation_ms: 15000
  benchmark_ms: 30000
